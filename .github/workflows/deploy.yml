name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one midway, a half-published site is
# worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The whole of CI, end-to-end tests included. Before this the deploy ran its
  # own copy of the fast checks and never waited for the browser tests, so main
  # could publish with them failing.
  ci:
    uses: ./.github/workflows/ci.yml

  # The database moves before the site does, so the code being published never
  # talks to an older schema. Migrations should therefore keep working with the
  # previous site for the minute between the two (add, then remove later).
  migrate:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Fail if there is no database to migrate
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL is not set. Add the session pooler connection string"
            echo "::error::from Supabase (Project Settings, Database) as a repository secret."
            echo "::error::See docs/DEPLOY.md, Migrations."
            exit 1
          fi

      - name: Apply migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run db:migrate

  build:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # Everything named VITE_* is baked into the public JavaScript. A database
      # connection string pasted into the wrong secret would publish the
      # database password to anyone who opens the site, so check the shape of
      # both before building. The values are never printed.
      - name: Refuse public secrets that look private
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          ok=1
          if ! printf '%s' "$VITE_SUPABASE_URL" | grep -Eq '^https://[a-z0-9]+\.supabase\.co/?$'; then
            echo "::error::VITE_SUPABASE_URL should be the Project URL, like https://abcd.supabase.co."
            echo "::error::It is something else. If it starts with postgresql://, the database"
            echo "::error::connection string went into the wrong secret: move it to SUPABASE_DB_URL."
            ok=0
          fi
          if ! printf '%s' "$VITE_SUPABASE_ANON_KEY" | grep -Eq '^(sb_publishable_|eyJ)'; then
            echo "::error::VITE_SUPABASE_ANON_KEY should be the publishable key (sb_publishable_...)"
            echo "::error::or the legacy anon key (eyJ...). Never a secret or service_role key."
            ok=0
          fi
          # A legacy key is a JWT, and service_role looks just like anon from the
          # outside, so read the role from its payload.
          if printf '%s' "$VITE_SUPABASE_ANON_KEY" | grep -q '^eyJ'; then
            role=$(node -e 'const p=process.argv[1].split(".")[1]||"";try{console.log(JSON.parse(Buffer.from(p,"base64url")).role||"")}catch{console.log("")}' "$VITE_SUPABASE_ANON_KEY")
            if [ "$role" != "anon" ]; then
              echo "::error::VITE_SUPABASE_ANON_KEY is a JWT for role '$role', not anon. Replace it and rotate that key."
              ok=0
            fi
          fi
          [ "$ok" = 1 ]

      - name: Build
        env:
          # Public by design: the anon key grants nothing without a session, and
          # every table is behind row-level security. See supabase/migrations/20261108000100_schema/migration.sql.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # The same check CI runs, on the build that is actually published.
      - name: The plans stay out of the bundle
        run: npm run bundle:check

      - name: Fail if the deploy would have no backend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::VITE_SUPABASE_URL is not set. The site would deploy with no sign-in"
            echo "::error::and no sync, silently reverting to local-only. Add the repository"
            echo "::error::secrets before deploying."
            exit 1
          fi

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on the first time this runs, so there is no manual step
          # in the repository settings.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
