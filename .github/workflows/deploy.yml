name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one midway, a half-published site is
# worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # The same gates as CI. A broken build should never reach the site.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run data:check
      - run: npm run text:check
      - run: npm run check:contrast
      - run: npm run db:check

      - name: Build
        env:
          # Public by design: the anon key grants nothing without a session, and
          # every table is behind row-level security. See supabase/schema.sql.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Fail if the deploy would have no backend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::VITE_SUPABASE_URL is not set. The site would deploy with no sign-in"
            echo "::error::and no sync, silently reverting to local-only. Add the repository"
            echo "::error::secrets before deploying."
            exit 1
          fi

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on the first time this runs, so there is no manual step
          # in the repository settings.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
